name: hil-serl-rubetek
channels:
  - conda-forge
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip

  # -----------------------
  # Conda dependencies
  # -----------------------
  - absl-py>=0.12.0
  - chex>=0.1.85
  - defusedxml
  - distrax==0.1.5
  - dm-tree>=0.1.8
  - einops>=0.6.1
  - flask
  - flax>=0.8.0
  - gym>=0.26
  - gymnasium==0.29.1
  - hidapi
  - imageio>=2.31.1
  - lz4
  - matplotlib
  - ml-collections>=0.1.0
  - moviepy>=1.0.3
  - natsort
  - numpy=1.26.*
  - opencv
  - optax>=0.1.5
  - pre-commit==3.3.3
  - pymodbus==2.5.3
  - pynput
  - pyquaternion
  - pyyaml
  - pyzmq
  - requests
  - rospkg
  - scipy=1.11.*
  - tqdm>=4.60.0
  - typing_extensions

  # -----------------------
  # Pip dependencies
  # -----------------------
  - pip:
      # Tensorflow (CPU/GPU auto mode, как ты указал)
      - tensorflow==2.19.0
      - tensorflow-probability==0.25.0

      # JAX: jax & jaxlib with CUDA build
      - "jax[cuda12_pip]==0.4.35"
      - "jaxlib==0.4.34"

      # Pixi PyPI deps
      - pyrealsense2==2.56.4.9191
      - pyspacemouse
      - protobuf>=5,<6
      - ml-dtypes>=0.5.1,<1
      - wandb==0.22.3

      # Git dependency
      - agentlace @ git+https://github.com/youliangtan/agentlace.git@cf2c337c5e3694cdbfc14831b239bd657bc4894d

      # Editable local packages
      - -e ./
      - -e third_party/RC10_control
      - -e serl_launcher
      - -e serl_robot_infra
